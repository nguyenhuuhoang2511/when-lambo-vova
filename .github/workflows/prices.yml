name: Cap nhat gia
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lay gia tu CoinGecko
        run: |
          set -e
          curl -sf "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,solana,ripple,dogecoin,pax-gold&vs_currencies=usd&include_24hr_change=true" -o /tmp/tickers.json
          curl -sf "https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=250&interval=daily" -o /tmp/btc.json
          node -e "
            const fs = require('fs');
            const t = JSON.parse(fs.readFileSync('/tmp/tickers.json'));
            const b = JSON.parse(fs.readFileSync('/tmp/btc.json'));
            fs.mkdirSync('data', { recursive: true });
            const x = JSON.parse(fs.readFileSync('/tmp/xau.json'));
            const f = JSON.parse(fs.readFileSync('/tmp/fx.json'));
            fs.writeFileSync('data/live.json', JSON.stringify({ at: Date.now(), tickers: t, btcDaily: b.prices, xau: x.price ? x : null, fx: f.rates ? f.rates.VND : null }));
          "
      - name: Commit neu co thay doi
        run: |
          git config user.name "when-lambo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "cap nhat gia $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
